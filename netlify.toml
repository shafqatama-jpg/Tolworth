# Static site: no build step. Netlify publishes the "site" folder as-is.
[build]
  publish = "site"
  command = "echo 'static site - no build needed'"

[[redirects]]
  from = "/booking"
  to = "/book/"
  status = 301
[[redirects]]
  from = "/resources"
  to = "/learner-resources/"
  status = 301
[[redirects]]
  from = "/admin"
  to = "/"
  status = 301
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/lessons/"
  status = 301
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
